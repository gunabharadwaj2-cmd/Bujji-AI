<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f20">
  <title>BUJJI AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      background: radial-gradient(circle at top, #18365c, #080f20 65%);
      color: #f4f8ff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 18px 8px;
    }

    h1 {
      margin: 0;
      color: #56dcff;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #b9cce5;
      margin-top: 8px;
    }

    .orb {
      width: 105px;
      height: 105px;
      margin: 20px auto;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d7ffff, #56dcff 25%, #1766ad 60%, #101b43);
      box-shadow: 0 0 28px #35bfff80;
    }

    .panel {
      padding: 16px;
      margin: 14px 0;
      border-radius: 16px;
      background: #111d32eF;
      border: 1px solid #344966;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #8ee8ff;
      font-weight: bold;
    }

    select,
    textarea {
      display: block;
      width: 100%;
      padding: 12px;
      color: #fff;
      background: #091326;
      border: 1px solid #405575;
      border-radius: 10px;
      font: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      min-width: 105px;
      padding: 12px 10px;
      border: 0;
      border-radius: 10px;
      background: #56dcff;
      color: #071323;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #293c58;
      color: white;
      border: 1px solid #506580;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
      min-height: 45px;
    }

    #status {
      text-align: center;
      color: #9fe9c2;
    }

    #error {
      color: #ffb8b8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 18px 4px;
      color: #94a9c5;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>BUJJI AI</h1>
      <div class="subtitle">Your Personal AI Assistant</div>
      <div class="orb" aria-hidden="true"></div>
      <div id="status" role="status">Ready to assist you</div>
    </header>

    <section class="panel">
      <label for="language">Language / భాష</label>
      <select id="language">
        <option value="te-IN">తెలుగు</option>
        <option value="en-IN">English</option>
        <option value="hi-IN">हिन्दी</option>
      </select>
    </section>

    <section class="panel">
      <label for="message">Talk to Bujji AI</label>
      <textarea
        id="message"
        placeholder="బుజ్జి AI, నీ ప్రశ్న టైప్ చేయి..."
      ></textarea>

      <div class="buttons">
        <button id="sendBtn" type="button">Send Message</button>
        <button id="micBtn" class="secondary" type="button">
          🎤 Speak
        </button>
      </div>
    </section>

    <section class="panel">
      <label>మీరు చెప్పిన మాటలు / Heard Text</label>
      <div id="heard" class="content">ఇక్కడ voice input కనిపిస్తుంది.</div>
    </section>

    <section class="panel">
      <label>Bujji AI Reply</label>
      <div id="reply" class="content" aria-live="polite">
        హాయ్! నేను బుజ్జి AI. నీకు ఎలా సహాయం చేయాలి?
      </div>

      <div class="buttons">
        <button id="repeatBtn" type="button">🔊 Repeat Reply</button>
        <button id="stopBtn" class="secondary" type="button">
          Stop Voice
        </button>
      </div>
    </section>

    <section class="panel">
      <label>Connection Details</label>
      <div id="error" role="status">No errors reported.</div>
    </section>

    <footer>BUJJI AI Assistant</footer>
  </main>

  <script>
    "use strict";

    const WORKER_URL =
      "https://bujji-ai-assistant.gunabharadwaj2.workers.dev";

    const languageEl = document.getElementById("language");
    const messageEl = document.getElementById("message");
    const heardEl = document.getElementById("heard");
    const replyEl = document.getElementById("reply");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const repeatBtn = document.getElementById("repeatBtn");
    const stopBtn = document.getElementById("stopBtn");

    let isBusy = false;
    let recognition = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setError(text) {
      errorEl.textContent = text;
    }

    async function sendMessage() {
      const message = messageEl.value.trim();

      if (!message) {
        setError("ముందుగా నీ మెసేజ్ టైప్ చేయి లేదా మైక్ ఉపయోగించు.");
        return;
      }

      if (isBusy) {
        setError("దయచేసి ప్రస్తుత సమాధానం వచ్చే వరకు వేచి ఉండు.");
        return;
      }

      isBusy = true;
      sendBtn.disabled = true;
      setStatus("Bujji AI is thinking...");
      setError("");
      replyEl.textContent = "";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Server error: " + response.status
          );
        }

        if (
          !data ||
          typeof data.reply !== "string" ||
          !data.reply.trim()
        ) {
          throw new Error("AI నుంచి సరైన సమాధానం రాలేదు.");
        }

        replyEl.textContent = data.reply.trim();
        setStatus("Bujji AI is ready");
      } catch (error) {
        console.error("Bujji AI request failed:", error);
        setStatus("Connection problem");

        if (error instanceof TypeError) {
          setError(
            "Worker కనెక్షన్ విఫలమైంది. Internet, Worker URL, " +
            "CORS సెట్టింగ్స్ చెక్ చేయి."
          );
        } else {
          setError(error.message || "దయచేసి మళ్లీ ప్రయత్నించు.");
        }
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    function startVoiceInput() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        setError(
          "ఈ browserలో speech recognition అందుబాటులో లేదు. " +
          "మరో supported browserలో ప్రయత్నించు."
        );
        return;
      }

      if (recognition) {
        recognition.abort();
      }

      recognition = new SpeechRecognition();
      recognition.lang = languageEl.value;
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = function () {
        micBtn.disabled = true;
        setStatus("Listening... మాట్లాడు");
        setError("");
      };

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        messageEl.value = transcript;
        heardEl.textContent = transcript;
      };

      recognition.onerror = function (event) {
        setError("Voice input error: " + event.error);
      };

      recognition.onend = function () {
        micBtn.disabled = false;
        setStatus("Bujji AI is ready");
      };

      try {
        recognition.start();
      } catch (error) {
        micBtn.disabled = false;
        setError("మైక్ ప్రారంభం కాలేదు. మళ్లీ ప్రయత్నించు.");
      }
    }

    function speakReply() {
      const text = replyEl.textContent.trim();

      if (!text) {
        setError("చదవడానికి సమాధానం లేదు.");
        return;
      }

      if (!("speechSynthesis" in window)) {
        setError("ఈ browserలో voice output support లేదు.");
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = languageEl.value;
      utterance.rate = 0.95;

      utterance.onerror = function () {
        setError("Voice outputలో సమస్య వచ్చింది.");
      };

      window.speechSynthesis.speak(utterance);
      setError("");
    }

    function stopVoice() {
      if (recognition) {
        recognition.abort();
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      micBtn.disabled = false;
      setStatus("Voice stopped");
    }

    sendBtn.addEventListener("click", sendMessage);
    micBtn.addEventListener("click", startVoiceInput);
    repeatBtn.addEventListener("click", speakReply);
    stopBtn.addEventListener("click", stopVoice);

    messageEl.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
